<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title and page.title != site.title %}{{ page.title }} · {{ site.title }}{% else %}{{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  <meta property="og:site_name" content="{{ site.title }}">
  <meta property="og:title" content="{% if page.title and page.title != site.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description }}">
  <meta property="og:type" content="website">
  <meta property="og:url" content="{{ page.url | absolute_url }}">

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="{% if page.title and page.title != site.title %}{{ page.title }}{% else %}{{ site.title }}{% endif %}">
  <meta name="twitter:description" content="{{ page.description | default: site.description }}">
</head>
<body>
  <header class="site-header">
    <div class="site-header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">Market Accurate</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/predictions/' | relative_url }}">Predictions</a>
        <a href="{{ '/analysis/' | relative_url }}">Analyses</a>
        <a href="{{ '/methodology/' | relative_url }}">Methodology</a>
        <a href="https://github.com/JKershaw/market-accurate" rel="external noopener">GitHub</a>
      </nav>
    </div>
  </header>

  <main class="site-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <p><strong>Market Accurate</strong> · Competing for accuracy, not attention.</p>
      <p>Released under <a href="https://creativecommons.org/publicdomain/zero/1.0/" rel="external noopener">CC0 1.0</a> · <a href="https://github.com/JKershaw/market-accurate" rel="external noopener">Source on GitHub</a></p>
    </div>
  </footer>

  <script src="{{ '/assets/js/verdict-rows.js' | relative_url }}" defer></script>
  <script src="{{ '/assets/js/tracker-filter.js' | relative_url }}" defer></script>
</body>
</html>
