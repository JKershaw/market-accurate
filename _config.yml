# Market Accurate - Jekyll Configuration
# Accuracy-focused financial analysis

title: Market Accurate
description: Open-source financial analysis optimized for accuracy, not attention.
url: "https://www.jkershaw.com"
baseurl: "/market-accurate"

# Build settings
markdown: kramdown
highlighter: rouge

# Collections: one file per prediction (single source of truth)
collections:
  predictions:
    output: true
    permalink: /predictions/:name/

# Theme - self-contained custom layout in _layouts/default.html
plugins: []

# Kramdown settings
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: "default"
  - scope:
      path: ""
      type: predictions
    values:
      layout: "default"

# Exclude from build
exclude:
  - .claude
  - .github
  - CLAUDE.md
  - CONTRIBUTING.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - docs/agent-infrastructure.md

# Navigation
# Note: /predictions/ is rendered from predictions/tracker.md (single source of truth)
header_pages:
  - index.md
  - predictions/tracker.md
  - methodology.md
